serial_number: a200-0000
version: 0
system:
  hosts:
    - hostname: cpr-a200-0000
      ip: 192.168.131.1
  ros2:
    namespace: a200_0000
platform:
  attachments:
    - name: front_bumper
      type: a200.bumper
      parent: front_bumper_mount
    - name: rear_bumper
      type: a200.bumper
      parent: rear_bumper_mount
    - name: top_plate
      type: a200.top_plate

sensors:
  lidar2d:
    - model: rplidar
      urdf_enabled: true
      launch_enabled: true
      parent: front_bumper_link
      xyz: [0.0, 0.0, 0.08]
      rpy: [0.0, 0.0, 0.0]

    - model: rplidar
      urdf_enabled: true
      launch_enabled: true
      parent: rear_bumper_link
      xyz: [0.0, 0.0, 0.08]
      rpy: [0.0, 0.0, 3.141592653589793]
  imu:
    - model: microstrain_imu
      urdf_enabled: true
      launch_enabled: true
      parent: base_link
      xyz: [0.0, 0.0, 0.05]
      rpy: [0.0, 0.0, 0.0]